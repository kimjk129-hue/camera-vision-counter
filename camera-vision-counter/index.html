<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<title>스마트 카메라 카운터</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: rgba(12, 17, 26, 0.72);
    --person: #22e06b;
    --vehicle: #ffb02e;
    --text: #f2f5fa;
    --muted: #9aa7b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #video, #overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  #video { background: #000; }

  /* 상단 카운터 */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 12px) 12px 12px;
    display: flex; gap: 10px; justify-content: center;
    pointer-events: none;
    z-index: 5;
  }
  .card {
    flex: 1 1 0; max-width: 220px;
    background: var(--panel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 12px 14px;
    text-align: center;
  }
  .card .label { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
  .card .count { font-size: 40px; font-weight: 800; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card.person .count { color: var(--person); }
  .card.vehicle .count { color: var(--vehicle); }

  /* 하단 컨트롤 */
  #controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; gap: 10px; align-items: center; justify-content: center;
    z-index: 5;
  }
  button {
    font: inherit; font-weight: 700;
    color: var(--text);
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 12px 18px;
    cursor: pointer;
  }
  button.primary { background: #2b68ff; border-color: #2b68ff; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; }

  /* 시작 화면 */
  #start {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
    background: radial-gradient(1200px 600px at 50% 0%, #16203a, var(--bg));
  }
  #start h1 { font-size: 24px; margin: 0; }
  #start p { color: var(--muted); margin: 0; max-width: 320px; line-height: 1.6; font-size: 14px; }
  #debug {
    width: min(92vw, 520px); max-height: 34vh; overflow: auto;
    margin: 4px 0 0; padding: 10px 12px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.5; color: #b8c4d4;
    white-space: pre-wrap; word-break: break-all; text-align: left;
  }
  #debug:empty { display: none; }
  #status {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 84px);
    background: var(--panel); color: var(--text);
    padding: 8px 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 6; white-space: nowrap;
  }
  #status.hidden { display: none; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.15); border-top-color: #2b68ff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div id="hud">
  <div class="card person">
    <div class="label">사람</div>
    <div class="count" id="personCount">0</div>
  </div>
  <div class="card vehicle">
    <div class="label">차량</div>
    <div class="count" id="vehicleCount">0</div>
  </div>
</div>

<div id="status" class="hidden">준비 중…</div>

<div id="controls" hidden>
  <button id="flipBtn">카메라 전환</button>
  <button id="boxBtn">박스 끄기</button>
  <button id="stopBtn">정지</button>
</div>

<div id="start">
  <h1>스마트 카메라 카운터</h1>
  <p>휴대폰 카메라에 비치는 <b>사람</b>과 <b>차량</b>을 실시간으로 인식해서 개수를 세어줍니다. 아래 버튼을 누르면 카메라 권한을 요청합니다.</p>
  <div class="spinner" id="startSpinner" hidden></div>
  <button class="primary" id="startBtn">카메라 시작</button>
  <p id="startErr" style="color:#ff6b6b" hidden></p>
  <pre id="debug"></pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
